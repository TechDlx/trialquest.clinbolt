<!doctype html>
<html lang="en">
  <head>
    <!-- Google tag (gtag.js). Every screen is this one page, so this tag covers them all; the
         router reports each screen change (src/app/analytics.ts). If this inline script changes,
         update its sha256 in deploy/quest.caddy (analytics.test.ts checks they match). -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-2QBG227Q5J"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      // Only the live site reports: local builds, previews and test runs stay out of the data.
      if (location.hostname !== 'quest.clinbolt.com') window['ga-disable-G-2QBG227Q5J'] = true;
      // The router sends one page_view per screen, including the first.
      gtag('config', 'G-2QBG227Q5J', { send_page_view: false });
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f766e" />
    <meta
      name="description"
      content="Trial Quest: play every job in drug development and guide a patient from diagnosis to an approved medicine. Educational simulation."
    />
    <!-- Link previews. Scrapers need absolute URLs and ignore everything after "#". -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ClinBolt" />
    <meta property="og:title" content="Trial Quest: from molecule to medicine" />
    <meta
      property="og:description"
      content="Step into 44 roles and learn how a new treatment reaches the people who need it. An educational clinical trial game by ClinBolt."
    />
    <meta property="og:url" content="https://quest.clinbolt.com/" />
    <meta property="og:image" content="https://quest.clinbolt.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Trial Quest by ClinBolt: Dose the capsule mascot waving to Maya, under the line From molecule to medicine."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/icon.svg" />
    <title>Trial Quest</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
